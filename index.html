<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JOJTEK CARS – transport samochodów, aut uszkodzonych, odbiór z aukcji i pomoc drogowa. Wieliczka, Kraków, Polska i Europa."><title>JOJTEK CARS | Transport samochodów</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080a0d;color:#f5f7fa;font-family:Arial,sans-serif;line-height:1.55}a{text-decoration:none;color:inherit}.wrap{max-width:1160px;margin:auto;padding:0 22px}header{position:sticky;top:0;z-index:10;background:#080a0dee;border-bottom:1px solid #252b33}nav{height:70px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:900}.logo span,.accent,.phone{color:#ffbf00}.nav{display:flex;gap:24px;font-size:14px;font-weight:700}.btn{display:inline-flex;padding:14px 19px;border-radius:10px;font-weight:900;border:1px solid #343b44}.primary{background:#ffbf00;color:#111;border-color:#ffbf00}.dark{background:#161b21}.hero{padding:75px 0;background:radial-gradient(circle at 75% 20%,#393127,#15181d 35%,#080a0d 72%)}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}.eyebrow{color:#ffbf00;font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(43px,6vw,76px);line-height:.98;margin:15px 0 20px}.lead{font-size:19px;color:#c9d0d8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.trust{display:flex;gap:18px;flex-wrap:wrap;color:#bbc3cc;font-size:14px}.trust b{color:white}.hero-photo{height:480px;border-radius:20px;overflow:hidden;border:1px solid #3a4149;position:relative}.hero-photo img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;bottom:18px;left:18px;right:18px;background:#000b;padding:13px;border-radius:9px;font-weight:800}section{padding:72px 0}.title{font-size:38px;margin:0 0 9px}.sub{color:#aab2bc;margin:0 0 32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.contact,form{background:#12161b;border:1px solid #252b33;border-radius:16px;padding:24px}.icon{font-size:29px}.card h3{margin:10px 0 6px}.card p{margin:0;color:#aab2bc}.band{background:#11161b;border-block:1px solid #252b33}.stats{display:grid;grid-template-columns:repeat(4,1fr)}.stat{padding:24px;border-right:1px solid #252b33}.stat:last-child{border:0}.stat strong{font-size:29px}.stat span{display:block;color:#aab2bc;font-size:13px}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:14px}.gallery img{width:100%;height:260px;object-fit:cover;border-radius:14px;border:1px solid #252b33}.gallery .big{height:534px;grid-row:span 2}.quote{display:grid;grid-template-columns:.85fr 1.15fr;gap:32px}.phone{font-size:31px;font-weight:900;margin:12px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}form{display:grid;gap:13px}label{font-size:13px;font-weight:800}input,select,textarea{width:100%;margin-top:6px;background:#0c0f13;border:1px solid #343b44;color:#fff;padding:13px;border-radius:9px;font:inherit}textarea{min-height:110px}footer{padding:28px 0;border-top:1px solid #252b33;color:#89929d;font-size:13px}@media(max-width:820px){.nav{display:none}.hero-grid,.quote{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.hero-photo{height:350px}.gallery{grid-template-columns:1fr}.gallery .big{height:320px;grid-row:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.hero-photo{height:290px}}
</style></head><body>
<header><div class="wrap"><nav><a class="logo">JOJTEK <span>CARS</span></a><div class="nav"><a href="#uslugi">Usługi</a><a href="#galeria">Galeria</a><a href="#opinie">Opinie</a><a href="#wycena">Wycena</a><a href="#kontakt">Kontakt</a></div><a class="btn primary" href="#wycena">Szybka wycena</a></nav></div></header>
<div id="app"><section class="hero"><div class="wrap"><p>Ładowanie strony…</p></div></section></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
 const [s,g,r]=await Promise.all([fetch('/content/site.json').then(x=>x.json()),fetch('/content/gallery.json').then(x=>x.json()),fetch('/content/reviews.json').then(x=>x.json())]);
 const phoneDigits=s.whatsapp.replace(/\D/g,''); const dirs=s.directions.join(' • ');
 const services=s.services.map(x=>`<div class="card"><div class="icon">${esc(x.icon)}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join('');
 const gallery=g.photos.map((x,i)=>`<img class="${i===0?'big':''}" src="${esc(x.image)}" alt="${esc(x.caption||'JOJTEK CARS transport samochodów')}">`).join('');
 const reviews=r.reviews.map(x=>`<div class="card"><div class="icon">${'⭐️'.repeat(Math.max(1,Math.min(5,Number(x.stars)||5)))}</div><h3>${esc(x.name)}</h3><p>${esc(x.text)}</p></div>`).join('');
 const h=esc(s.headline); const headline=h.replace('Nasz transport.','<span class="accent">Nasz transport.</span>');
 document.querySelector('#app').innerHTML=`
 <section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Transport samochodów • Polska & Europa</div><h1>${headline}</h1><p class="lead">${esc(s.lead)}</p><div class="actions"><a class="btn primary" href="#wycena">📋 Zamów wycenę</a><a class="btn dark" href="tel:+${phoneDigits}">📞 ${esc(s.phone)}</a><a class="btn dark" href="https://wa.me/${phoneDigits}" target="_blank">💬 WhatsApp</a></div><div class="trust"><span>✓ <b>${esc(s.experience)} lat doświadczenia</b></span><span>✓ <b>${esc(s.cars)} aut</b></span><span>✓ Polska i Europa</span></div><div style="margin-top:14px;color:#aab2bc;font-size:14px">📍 <b style="color:#fff">${esc(s.location)}</b></div></div><div class="hero-photo"><img src="${esc(s.hero_image)}" alt="JOJTEK CARS"><div class="caption">${esc(s.hero_caption)}</div></div></div></section>
 <section id="uslugi"><div class="wrap"><h2 class="title">Co możemy dla Ciebie zrobić?</h2><p class="sub">Transport auta od odbioru po bezpieczne dostarczenie.</p><p class="sub" style="margin-top:-18px"><b style="color:#fff">Obsługiwane kierunki:</b> ${esc(dirs)}</p><div class="grid">${services}</div></div></section>
 <section class="band"><div class="wrap stats"><div class="stat"><strong>${esc(s.experience)}</strong><span>lat doświadczenia</span></div><div class="stat"><strong>${esc(s.cars)}</strong><span>przetransportowanych aut</span></div><div class="stat"><strong>PL / EU</strong><span>obszar działania</span></div><div class="stat"><strong>${esc(s.availability)}</strong><span>kontakt i zlecenia</span></div></div></section>
 <section id="galeria"><div class="wrap"><h2 class="title">Nasza laweta w pracy</h2><p class="sub">Prawdziwe zdjęcia z realizacji.</p><div class="gallery">${gallery}</div></div></section>
 <section id="opinie"><div class="wrap"><h2 class="title">Opinie klientów</h2><p class="sub">Najważniejsze są dla nas zadowolenie klienta i bezpiecznie dostarczone auto.</p><div class="grid">${reviews}</div></div></section>
 <section id="wycena"><div class="wrap quote"><div><div class="eyebrow">Szybka wycena</div><h2 class="title">Podaj trasę i auto.</h2><p class="sub">Wyślij podstawowe informacje. Możesz też od razu zadzwonić.</p><div class="contact" id="kontakt"><b>Potrzebujesz transportu?</b><div class="phone">${esc(s.phone)}</div><a class="btn primary" href="tel:+${phoneDigits}">📞 Zadzwoń</a> <a class="btn dark" href="https://wa.me/${phoneDigits}" target="_blank">💬 WhatsApp</a></div></div><form onsubmit="sendQuote(event, '${phoneDigits}')"><div class="two"><label>Skąd<input id="from" required placeholder="np. Kraków"></label><label>Dokąd<input id="to" required placeholder="np. Warszawa"></label></div><div class="two"><label>Samochód<input id="car" required placeholder="np. BMW 320d"></label><label>Telefon<input id="phone" required placeholder="Twój numer"></label></div><label>Stan auta<select id="condition"><option>Sprawny / jeżdżący</option><option>Uszkodzony, ale możliwy do załadunku</option><option>Niesprawny / potrzebna pomoc</option></select></label><label>Dodatkowe informacje<textarea id="message" placeholder="Np. auto po kolizji, odbiór z aukcji..."></textarea></label><button class="btn primary" type="submit">WYŚLIJ ZAPYTANIE</button><small style="color:#89929d">Formularz przygotuje wiadomość WhatsApp.</small></form></div></section>
 <footer><div class="wrap">© 2026 JOJTEK CARS • Transport samochodów i pomoc drogowa • ${esc(s.location)} • Polska / Europa</div></footer>`;
}
function sendQuote(e,phone){e.preventDefault();let f=document.querySelector('#from').value,t=document.querySelector('#to').value,c=document.querySelector('#car').value,p=document.querySelector('#phone').value,s=document.querySelector('#condition').value,m=document.querySelector('#message').value;let x=`Dzień dobry, proszę o wycenę transportu auta.%0ASkąd: ${encodeURIComponent(f)}%0ADokąd: ${encodeURIComponent(t)}%0AAuto: ${encodeURIComponent(c)}%0AStan: ${encodeURIComponent(s)}%0ATelefon: ${encodeURIComponent(p)}%0AInfo: ${encodeURIComponent(m)}`;window.open('https://wa.me/'+phone+'?text='+x,'_blank')}
load().catch(()=>document.querySelector('#app').innerHTML='<section class="hero"><div class="wrap"><h2>Wystąpił problem z wczytaniem strony.</h2><p>Odśwież stronę.</p></div></section>');
</script></body></html>
